# Supabase gratis pausa el proyecto tras 7 días sin uso. Esta tarea visita la
# tienda cada 3 días (GET /api/salud hace una consulta mínima) para evitarlo.
# Configura la URL en: GitHub → Settings → Secrets and variables → Actions →
# Variables → SITIO_URL (ej. https://elhincha.netlify.app). No es un secreto.

name: Mantener Supabase activo

on:
  schedule:
    - cron: '17 13 */3 * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Visitar /api/salud
        env:
          SITIO_URL: ${{ vars.SITIO_URL }}
        run: |
          if [ -z "$SITIO_URL" ]; then echo "Falta la variable SITIO_URL"; exit 1; fi
          curl -fsS --retry 3 --retry-delay 20 "$SITIO_URL/api/salud"
